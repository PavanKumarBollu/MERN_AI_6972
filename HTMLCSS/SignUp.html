<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Sign Up</h1>
    <form action="#" method="Post">
      <p>UserName : <input type="text" placeholder="UserName" /></p>
      <p>Password : <input type="Password" placeholder="Password" /></p>
      <p>Gender : <input type="Radio" /> Male <input type="Radio" /> Female</p>
      <p>DOB : <input type="date" placeholder="Date of Birth" /></p>
      <p>PhoneNo : <input type="number" placeholder="Enter Phone Number" /></p>
      <p>Email : <input type="email" placeholder="Enter Email" /></p>
      <p>Languages : <input type="checkbox" />English
      <input type="checkbox" />Hindi <input type="checkbox" />French
      </p>
      <p>
        ProfilePic : <input type="file" placeholder="Upload Profile Picture" />
      </p>

      <input type="submit" value="Register" />
      <input type="reset" value="Reset" />
      <p>        About us | Privacy Policy | Contact Us | FAQ | Terms & Conditions |
        Copyright © 2023 2018
      </p>
    </form>
  </body>
</html>
