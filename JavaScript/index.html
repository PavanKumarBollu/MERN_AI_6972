    <button class="btnt">A</button>
    <button class="btnt">B</button>
    <button class="btnt">C</button>
    <button class="btnt">D</button>

    <script>
      let text = document.getElementById("test");

      document.querySelectorAll(".btnt").forEach((btn) => {
        btn.addEventListener("click", () => {
          text.innerText = text.innerText + btn.innerHTML;
        });
      });
    </script>
